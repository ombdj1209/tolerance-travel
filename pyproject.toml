[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tolerance-travel"
version = "0.1.0"
description = "Agent-versus-baseline evaluation harness with tool-spec mutation testing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["tolerance_travel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
